name: release

# Stable release. Triggered by a vX.Y.Z tag pushed on main.
# Builds Final x {x64, Win32} without UPX compression, then publishes
# a GitHub Release with the zips attached. A tag of another form, or one
# already published as a pre-release, publishes nothing here (test builds
# go through prerelease.yml); a vX.Y.Z tag outside main fails.
#
# UPX was dropped in 3.0.1: several antivirus products flagged the
# packed executable as a false-positive trojan, blocking download or
# launch on end-user machines. The vcxproj still runs `upx --best`
# by default; passing BlueMsxPackUpx=false here suppresses that step.

on:
  push:
    tags: ['v*']
    branches: [ci-test]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.check.outputs.stable }}
      previous: ${{ steps.check.outputs.previous }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Accept only a vX.Y.Z tag on main that is not a pre-release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          stable=true
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
               [[ "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease 2>/dev/null)" == true ]]; then
              stable=false
              echo "::notice::$GITHUB_REF_NAME is not a stable release tag; nothing is published"
            elif ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::$GITHUB_REF_NAME is not on main; push main, then re-run this workflow"
              exit 1
            fi
          fi
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          # Release notes start from the stable release before this one, not from a pre-release in between.
          previous=$(git tag --merged HEAD^ --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.stable == 'true'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    steps:
      - uses: actions/checkout@v6

      # A tag is checked out detached; the gate has made sure it is on main.
      - name: Put the checkout on main
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: git checkout -B main

      - uses: microsoft/setup-msbuild@v3

      - name: Build (Final, no UPX)
        working-directory: blueMSX/Make/msvc2022
        shell: pwsh
        run: |
          msbuild blueMSX.sln /m `
            '/t:blueMSX;TraceWindow;Trainer;SimpleDebugger' `
            "/p:Configuration=Final;Platform=${{ matrix.platform }};BlueMsxPackUpx=false"

      - name: Package
        shell: pwsh
        run: |
          $zip = "dist/blueMSX+-${{ github.ref_name }}-${{ matrix.platform }}.zip"
          ./scripts/ci-package.ps1 -Config Final -Platform ${{ matrix.platform }} -OutZip $zip

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.zip
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [gate, build]
    # Only publish on tag pushes — branch pushes (e.g. ci-test) just exercise
    # the Final build + packaging steps without creating a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
          previous_tag: ${{ needs.gate.outputs.previous }}
