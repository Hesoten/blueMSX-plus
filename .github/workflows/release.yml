name: release

# Stable release. Triggered by a vX.Y.Z tag pushed on main.
# Builds Final x {x64, Win32} with UPX compression, then publishes a
# GitHub Release with the zips attached. Tags containing '-' (e.g.
# v1.2.0-rc1) are published as pre-releases.

on:
  push:
    tags: ['v*']
    branches: [ci-test]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    steps:
      - uses: actions/checkout@v6

      - uses: microsoft/setup-msbuild@v3

      - name: Install UPX
        shell: pwsh
        run: choco install upx -y --no-progress

      - name: Build (Final, UPX on)
        working-directory: blueMSX/Make/msvc2022
        shell: pwsh
        run: |
          msbuild blueMSX.sln /m `
            '/t:blueMSX;TraceWindow;Trainer;SimpleDebugger' `
            "/p:Configuration=Final;Platform=${{ matrix.platform }}"

      - name: Package
        shell: pwsh
        run: |
          $zip = "dist/blueMSX+-${{ github.ref_name }}-${{ matrix.platform }}.zip"
          ./scripts/ci-package.ps1 -Config Final -Platform ${{ matrix.platform }} -OutZip $zip

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    # Only publish on tag pushes — branch pushes (e.g. ci-test) just exercise
    # the Final build + packaging steps without creating a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
