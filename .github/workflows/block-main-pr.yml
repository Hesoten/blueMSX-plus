name: Block PRs to Main

on:
  pull_request_target:
    branches:
      - main
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  block-pr:
    if: github.event.pull_request.user.login != 'Hesoten'
    runs-on: ubuntu-latest
    steps:
      - name: Close Pull Request
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "⚠️ Pull requests to \`${{ github.base_ref }}\` are not accepted. Please open your PR against the \`develop\` branch instead.

          \`${{ github.base_ref }}\` ブランチへの直接のプルリクエストは受け付けていません。 \`develop\` ブランチに対してプルリクエストを作成してください。"
          gh pr close ${{ github.event.pull_request.number }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
